<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAN Pick List</title>

<style>
body {
  font-family: Arial;
  background: #f5f6f8;
  margin: 0;
  padding: 30px;
  display: flex;
  justify-content: center;
}

.card {
  width: 100%;
  max-width: 1000px;
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  height: 180px;
  font-family: monospace;
  font-size: 14px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #4a90e2;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #3b7bd6;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  font-size: 13px;
}

th {
  background: #4a90e2;
  color: white;
  padding: 8px;
  text-align: left;
}

td {
  border: 1px solid #ddd;
  padding: 6px;
  vertical-align: top;
}

/* ✅ EAN (optimized for 15 digits) */
th:nth-child(1),
td:nth-child(1) {
  width: 160px;
  white-space: nowrap;
  text-align: left;
  font-family: monospace;
}

/* REQUIRED */
th:nth-child(2),
td:nth-child(2) {
  width: 60px;
  text-align: center;
  font-weight: bold;
}

/* TICK */
th:nth-child(3),
td:nth-child(3) {
  width: 40px;
  text-align: center;
}

/* LOCATION */
th:nth-child(4),
td:nth-child(4) {
  width: 120px;
  text-align: center;
  white-space: nowrap;
}

/* PRODUCT NAME */
th:nth-child(5),
td:nth-child(5) {
  text-align: left;
}
</style>
</head>

<body>

<div class="card">

<h2>EAN Pick List</h2>

<textarea id="input" placeholder="EAN[TAB]Qty"></textarea>

<button onclick="generate()">Generate</button>

<div id="result"></div>

</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQQa-6Tub9Q1Hgn5ecCBkB9HpvAaTy8I0u5L_F0xSMML6FRQVqmijau8XdnWLCHVn8dsXBhrxIxu0eR/pub?gid=0&single=true&output=csv";

let index = {};
let nameIndex = {};
let ready = false;

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;

  for (let char of line) {
    if (char === '"') inQuotes = !inQuotes;
    else if (char === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }

  result.push(current);
  return result;
}

// LOAD DATABASE
fetch(csvUrl)
.then(r => r.text())
.then(text => {

  const lines = text.split(/\r?\n/);

  for (let i = 1; i < lines.length; i++) {

    const cols = parseCSVLine(lines[i]);
    if (!cols || cols.length < 6) continue;

    const sku = (cols[0] || '').trim();
    const loc = (cols[1] || '').trim();

    if (sku && loc) {
      if (!index[sku]) index[sku] = [];
      index[sku].push(loc);
    }

    const ean = (cols[4] || '').trim();
    const name = (cols[5] || '').trim();

    if (ean && name) {
      nameIndex[ean] = name;
    }
  }

  ready = true;
  document.getElementById("result").innerHTML =
    "<b>Ready ✔</b>";
});

function generate() {

  if (!ready) {
    alert("Still loading database...");
    return;
  }

  const lines =
    document.getElementById("input")
      .value
      .trim()
      .split(/\r?\n/);

  let rows = [];

  for (const line of lines) {

    const cols = line.split(/\t+/);
    if (cols.length < 2) continue;

    const ean = cols[0].trim();
    const qty = cols[1].trim();

    const last4 = ean.slice(-4);

    const locations = index[last4] || [];
    const productName = nameIndex[ean] || "—";

    if (locations.length) {

      for (const loc of locations) {
        rows.push({ ean, qty, loc, productName });
      }

    } else {
      rows.push({
        ean,
        qty,
        loc: "NOT FOUND",
        productName
      });
    }
  }

  rows.sort((a, b) =>
    a.loc.localeCompare(b.loc, undefined, { numeric: true })
  );

  let html = `
  <table>
    <tr>
      <th>EAN</th>
      <th>Required</th>
      <th>Tick</th>
      <th>Location</th>
      <th>Product Name</th>
    </tr>
  `;

  for (const r of rows) {

    html += `
      <tr>
        <td>${r.ean}</td>
        <td>${r.qty}</td>
        <td></td>
        <td>${r.loc}</td>
        <td>${r.productName}</td>
      </tr>
    `;
  }

  html += "</table>";

  document.getElementById("result").innerHTML = html;
}

</script>

</body>
</html>
