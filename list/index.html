<!DOCTYPE html><html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAN Pick List Generator</title><style>
body{
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
}

.card{
width:100%;
max-width:900px;
background:#fff;
padding:25px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

h2{
margin-top:0;
}

textarea{
width:100%;
height:250px;
padding:12px;
font-family:Consolas, monospace;
font-size:14px;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#4a90e2;
color:white;
cursor:pointer;
margin-top:10px;
margin-right:10px;
}

button:hover

#status{
margin-top:10px;
font-weight:bold;
}

#result{
margin-top:20px;
white-space:pre-wrap;
font-family:Consolas, monospace;
background:#fafafa;
border:1px solid #ddd;
border-radius:8px;
padding:15px;
min-height:200px;
} </style></head>

<body><div class="card"><h2>EAN Pick List Generator</h2><p>
Paste directly from Excel/WPS:
</p><textarea id="input">
6937224111141	1
6937224114722	1
6937224115446	16
</textarea><button onclick="generate()">Generate Pick List</button><button onclick="copyResult()">Copy Result</button><div id="status">Loading location database...</div><div id="result"></div></div><script>

const csvUrl =
"[https://docs.google.com/spreadsheets/d/e/2PACX-1vQQa-6Tub9Q1Hgn5ecCBkB9HpvAaTy8I0u5L_F0xSMML6FRQVqmijau8XdnWLCHVn8dsXBhrxIxu0eR/pub?gid=0&single=true&output=csv](https://docs.google.com/spreadsheets/d/e/2PACX-1vQQa-6Tub9Q1Hgn5ecCBkB9HpvAaTy8I0u5L_F0xSMML6FRQVqmijau8XdnWLCHVn8dsXBhrxIxu0eR/pub?gid=0&single=true&output=csv)";

let index = {};
let ready = false;

function parseCSVLine(line) {

```
const result = [];
let current = "";
let inQuotes = false;

for (let char of line) {

    if (char === '"') {
        inQuotes = !inQuotes;
    }
    else if (char === ',' && !inQuotes) {
        result.push(current);
        current = "";
    }
    else {
        current += char;
    }
}

result.push(current);

return result;
```

}

fetch(csvUrl)
.then(r => r.text())
.then(text => {

```
const lines = text.split(/\r?\n/);

for (let i = 0; i < lines.length; i++) {

    const line = lines[i].trim();

    if (!line) continue;

    const cols = parseCSVLine(line);

    if (cols.length < 2) continue;

    const code =
        (cols[0] || "")
        .trim()
        .replace(/^'+/, "")
        .padStart(4,"0");

    const location =
        (cols[1] || "")
        .trim();

    if (!code || !location) continue;

    if (!index[code]) {
        index[code] = [];
    }

    index[code].push(location);
}

ready = true;

document.getElementById("status").innerText =
    "Location database loaded";
```

})
.catch(err => {

```
console.error(err);

document.getElementById("status").innerText =
    "Failed to load Google Sheet";
```

});

function generate() {

```
if (!ready) {

    document.getElementById("result").innerText =
        "Location database still loading...";

    return;
}

const input =
    document.getElementById("input")
    .value
    .trim();

if (!input) return;

const rows = input.split(/\r?\n/);

const output = [];

output.push("LOCATION\tQTY\tEAN");

for (const row of rows) {

    if (!row.trim()) continue;

    const cols = row.split(/\t+/);

    if (cols.length < 2) continue;

    const ean = cols[0].trim();
    const qty = cols[1].trim();

    const last4 = ean.slice(-4);

    const locations = index[last4];

    if (!locations || !locations.length) {

        output.push(
            `NOT FOUND\t${qty}\t${ean}`
        );

        continue;
    }

    for (const loc of locations) {

        output.push(
            `${loc}\t${qty}\t${ean}`
        );
    }
}

const header = output.shift();

output.sort((a,b) => {

    const locA = a.split("\t")[0];
    const locB = b.split("\t")[0];

    return locA.localeCompare(
        locB,
        undefined,
        {numeric:true}
    );
});

document.getElementById("result").innerText =
    header + "\n" + output.join("\n");
```

}

function copyResult() {

```
const text =
    document.getElementById("result").innerText;

if (!text) return;

navigator.clipboard.writeText(text);

alert("Copied to clipboard");
```

}

</script></body>

</html>
