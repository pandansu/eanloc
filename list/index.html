<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EAN Pick List</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f6f8;
      margin: 0;
      padding: 30px;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 220px;
      font-size: 16px;
      font-family: monospace;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #3b7bd6;
    }

    #result {
      margin-top: 20px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 16px;
      background: #fafafa;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>EAN Pick List Generator</h2>

  <textarea id="input" placeholder="Paste from Excel:
6937224126107    12
6937224111141    1"></textarea>

  <button onclick="generate()">Generate Pick List</button>

  <div id="result">Loading data...</div>

</div>

<script>

const csvUrl =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQa-6Tub9Q1Hgn5ecCBkB9HpvAaTy8I0u5L_F0xSMML6FRQVqmijau8XdnWLCHVn8dsXBhrxIxu0eR/pub?gid=0&single=true&output=csv";

let index = {};
let ready = false;

// SAME LOADER STYLE AS YOUR WORKING CODE
function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;

  for (let char of line) {
    if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }

  result.push(current);
  return result;
}

// LOAD DATABASE (UNCHANGED STRUCTURE)
fetch(csvUrl)
  .then(r => r.text())
  .then(text => {

    const lines = text.split(/\r?\n/);

    for (let i = 1; i < lines.length; i++) {

      const line = lines[i].trim();
      if (!line) continue;

      const cols = parseCSVLine(line);

      const sku = (cols[0] || '').trim();
      const loc = (cols[1] || '').trim();

      if (!sku || !loc) continue;

      if (!index[sku]) index[sku] = [];

      index[sku].push(loc);
    }

    ready = true;
    document.getElementById("result").innerText = "Ready ✔";
  })
  .catch(err => {
    document.getElementById("result").innerText = "CSV load failed";
    console.error(err);
  });

// PICK LIST GENERATOR (NEW PART ONLY)
function generate() {

  if (!ready) {
    document.getElementById("result").innerText =
      "Still loading database...";
    return;
  }

  const lines =
    document.getElementById("input")
      .value
      .trim()
      .split(/\r?\n/);

  let output = "";

  for (const line of lines) {

    const cols = line.split(/\t+/);
    if (cols.length < 2) continue;

    const ean = cols[0].trim();
    const qty = cols[1].trim();

    const last4 = ean.slice(-4);

    const locations = index[last4];

    if (locations && locations.length) {

      for (const loc of locations) {
        output += `${loc}\t${qty}\t${ean}\n`;
      }

    } else {
      output += `NOT FOUND\t${qty}\t${ean}\n`;
    }
  }

  document.getElementById("result").innerText = output;
}

</script>

</body>
</html>
