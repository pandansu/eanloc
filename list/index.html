<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Pick List</title>

<style>
body {
  font-family: Arial;
  background: #f5f6f8;
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
}

.card {
  width: 100%;
  max-width: 1000px;
  background: white;
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
  margin: 10px 0 15px;
}

/* INPUT AREA */
.textarea-wrap {
  position: relative;
}

textarea {
  width: 100%;
  height: 160px;
  font-family: monospace;
  font-size: 14px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-sizing: border-box;
}

/* CLEAR X BUTTON */
.clear-x {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 34px;
  height: 34px;
  background: #d6d6d6;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
}

/* BUTTONS */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

#generateBtn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #4a90e2;
  color: white;
  cursor: pointer;
}

#printBtn {
  flex: 0.4;
  display: none;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #2ecc71;
  color: white;
  cursor: pointer;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  font-size: 13px;
}

th {
  background: #4a90e2;
  color: white;
  padding: 5px;
  text-align: left;
}

td {
  border: 1px solid #ddd;
  padding: 4px 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* COLUMN WIDTHS */
td:nth-child(1), th:nth-child(1) { width: 110px; }
td:nth-child(2), th:nth-child(2) { width: 50px; text-align: center; }
td:nth-child(3), th:nth-child(3) { width: 28px; text-align: center; }
td.loc { width: 140px; }
td.name { width: 100%; }

/* PRINT CLEAN */
@media print {
  body * { visibility: hidden; }

  #result, #result * {
    visibility: visible;
  }

  #result {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }

  #result table tr:first-child {
    display: none;
  }

  td {
    padding: 2px 4px !important;
    font-size: 11px !important;
    line-height: 1.1 !important;
  }
}
</style>
</head>

<body>

<div class="card">

<h2>EAN Pick List</h2>

<div class="textarea-wrap">
  <textarea id="input" placeholder="Copy and paste full EAN and quantity"></textarea>
  <div class="clear-x" onclick="input.value=''">×</div>
</div>

<div class="btn-row">
  <button id="generateBtn" onclick="generate()">Generate</button>
  <button id="printBtn" onclick="window.print()">Print</button>
</div>

<div id="result"></div>

</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQQa-6Tub9Q1Hgn5ecCBkB9HpvAaTy8I0u5L_F0xSMML6FRQVqmijau8XdnWLCHVn8dsXBhrxIxu0eR/pub?gid=0&single=true&output=csv";

let index = {};
let nameIndex = {};
let ready = false;

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;

  for (let c of line) {
    if (c === '"') inQuotes = !inQuotes;
    else if (c === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += c;
    }
  }

  result.push(current);
  return result;
}

fetch(csvUrl)
.then(r => r.text())
.then(text => {

  const lines = text.split(/\r?\n/);

  for (let i = 1; i < lines.length; i++) {

    const cols = parseCSVLine(lines[i]);
    if (!cols || cols.length < 6) continue;

    const sku = (cols[0] || '').trim();
    const loc = (cols[1] || '').trim();

    if (sku && loc) {
      if (!index[sku]) index[sku] = [];
      index[sku].push(loc);
    }

    const ean = (cols[4] || '').trim();
    const name = (cols[5] || '').trim();

    if (ean && name) {
      nameIndex[ean] = name;
    }
  }

  ready = true;
  document.getElementById("result").innerHTML = "<b>Ready ✔</b>";
});

function sortLocation(a, b) {
  return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
}

function generate() {

  if (!ready) return;

  const lines = input.value.trim().split(/\n/);

  let rows = [];

  for (const line of lines) {

    const cols = line.split(/\t+/);
    if (cols.length < 2) continue;

    const ean = cols[0].trim();
    const qty = cols[1].trim();

    const last4 = ean.slice(-4);

    const locations = index[last4] || [];
    const productName = nameIndex[ean] || "—";

    const loc = locations.length ? locations[0] : "* NOT FOUND * ";

    rows.push({ ean, qty, loc, productName });
  }

  // SORT BY LOCATION
  rows.sort((a, b) => sortLocation(a.loc, b.loc));

  let html = `
  <table>
    <tr>
      <th>EAN</th>
      <th>Qty</th>
      <th></th>
      <th>Location</th>
      <th>Product Name</th>
    </tr>
  `;

  for (const r of rows) {
    html += `
      <tr>
        <td>${r.ean}</td>
        <td>${r.qty}</td>
        <td></td>
        <td class="loc">${r.loc}</td>
        <td class="name">${r.productName}</td>
      </tr>
    `;
  }

  html += "</table>";

  document.getElementById("result").innerHTML = html;
  printBtn.style.display = "block";
}

</script>

</body>
</html>
