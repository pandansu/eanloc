<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAN Pick List</title>

<style>
body {
  font-family: Arial;
  background: #f5f6f8;
  margin: 0;
  padding: 30px;
  display: flex;
  justify-content: center;
}

.card {
  width: 100%;
  max-width: 1000px;
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

/* TITLE (VISIBLE ONLY ON SCREEN) */
h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* INPUT */
.textarea-wrap {
  position: relative;
}

textarea {
  width: 100%;
  height: 180px;
  font-family: monospace;
  font-size: 14px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-sizing: border-box;
}

/* CLEAR X */
.clear-x {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 34px;
  height: 34px;
  background: #d6d6d6;
  color: #333;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

/* BUTTONS */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

#generateBtn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #4a90e2;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#generateBtn:disabled {
  background: #ccc;
  cursor: not-allowed;
}

#generateBtn.shrunk {
  flex: 0.6;
}

#printBtn {
  flex: 0.4;
  display: none;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #2ecc71;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  font-size: 13px;
}

th {
  background: #4a90e2;
  color: white;
  padding: 8px;
  text-align: left;
}

td {
  border: 1px solid #ddd;
  padding: 6px;
  vertical-align: top;
}

/* FORCE SINGLE LINE LOCATION */
.loc {
  white-space: nowrap;
}

/* TRUNCATE PRODUCT NAME (screen + print safe) */
.name {
  max-width: 280px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* PRINT OPTIMISATION */
@media print {

  body * {
    visibility: hidden;
  }

  #result, #result * {
    visibility: visible;
  }

  #result {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
  }

  /* REMOVE HEADER ROW */
  #result table tr:first-child {
    display: none;
  }

  /* COMPACT ROWS */
  td {
    padding: 2px 4px !important;
    font-size: 11px !important;
    line-height: 1.1 !important;
  }

  /* FORCE SINGLE LINE IN PRINT */
  .loc {
    white-space: nowrap !important;
  }

  /* TRUNCATE LONG TEXT IN PRINT */
  .name {
    max-width: 240px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
}
</style>
</head>

<body>

<div class="card">

<h2>EAN Pick List</h2>

<div class="textarea-wrap">
  <textarea id="input" placeholder="EAN[TAB]Qty"></textarea>
  <div class="clear-x" onclick="input.value=''">×</div>
</div>

<div class="btn-row">
  <button id="generateBtn" disabled onclick="generate()">Generate</button>
  <button id="printBtn" onclick="window.print()">Print</button>
</div>

<div id="result"></div>

</div>
