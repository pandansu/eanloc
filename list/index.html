<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Pick List</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #f5f6f8;
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
}

.card {
  width: 100%;
  max-width: 1000px;
  background: white;
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
}

.textarea-wrap {
  position: relative;
}

textarea {
  width: 100%;
  height: 160px;
  font-family: monospace;
  font-size: 14px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-sizing: border-box;
  resize: vertical;
  padding-right: 90px; /* space for buttons */
}

/* X BUTTON */
.clear-x {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 34px;
  height: 34px;
  background: #d6d6d6;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
  z-index: 2;
}

/* 📄 upload button inside textarea */
.upload-btn {
  position: absolute;
  top: 10px;
  right: 50px;
  width: 34px;
  height: 34px;
  background: #4a90e2;
  border: none;
  border-radius: 6px;
  color: white;
  cursor: pointer;
  font-size: 16px;
  z-index: 2;
}

/* BUTTONS */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

#generateBtn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #4a90e2;
  color: white;
  cursor: pointer;
}

#printBtn {
  flex: 0.4;
  display: none;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #2ecc71;
  color: white;
  cursor: pointer;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  font-size: 13px;
  table-layout: auto;
}

th {
  background: #4a90e2;
  color: white;
  padding: 6px;
  text-align: left;
}

td {
  border: 1px solid #ddd;
  padding: 5px;
  vertical-align: top;
  white-space: nowrap;
}

td.loc {
  white-space: nowrap;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
}

td.name {
  white-space: nowrap;
  width: 100%;
}

@media print {
  body * {
    visibility: hidden;
  }

  #result, #result * {
    visibility: visible;
  }

  #result {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }

  #result table tr:first-child {
    display: none;
  }

  textarea,
  .textarea-wrap,
  .btn-row {
    display: none !important;
  }
}
</style>
</head>

<body>

<div class="card">

<h2>Create Pick List</h2>

<div class="textarea-wrap">

  <textarea id="input" placeholder="Paste full EAN and quantity from Excel"></textarea>

  <!-- 📄 UPLOAD BUTTON -->
  <button class="upload-btn" onclick="document.getElementById('excelFile').click()">
    📄
  </button>

  <div class="clear-x" onclick="input.value=''">×</div>

  <input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none">

</div>

<div class="btn-row">
  <button id="generateBtn" onclick="generate()">Generate</button>
  <button id="printBtn" onclick="window.print()">Print</button>
</div>

<div id="result"></div>

</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQQa-6Tub9Q1Hgn5ecCBkB9HpvAaTy8I0u5L_F0xSMML6FRQVqmijau8XdnWLCHVn8dsXBhrxIxu0eR/pub?gid=0&single=true&output=csv";

let index = {};
let nameIndex = {};
let ready = false;

/* CSV */
function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;

  for (let c of line) {
    if (c === '"') inQuotes = !inQuotes;
    else if (c === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += c;
    }
  }
  result.push(current);
  return result;
}

function cleanName(name) {
  return (name || "")
    .replace(/Uniform color/gi, "")
    .replace(/\s{2,}/g, " ")
    .trim();
}

fetch(csvUrl)
.then(r => r.text())
.then(text => {

  const lines = text.split(/\r?\n/);

  for (let i = 1; i < lines.length; i++) {

    const cols = parseCSVLine(lines[i]);
    if (!cols || cols.length < 6) continue;

    const sku = (cols[0] || '').trim();
    const loc = (cols[1] || '').trim();
    const ean = (cols[4] || '').trim();
    const name = cleanName(cols[5]);

    if (sku && loc) {
      if (!index[sku]) index[sku] = [];
      index[sku].push(loc);
    }

    if (ean && name) {
      nameIndex[ean] = name;
    }
  }

  ready = true;
  document.getElementById("result").innerHTML = "<b>Ready ✔</b>";
});

/* EXCEL UPLOAD */
document.getElementById("excelFile").addEventListener("change", function(e) {

  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(evt) {

    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: "array" });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

    const output = [];

    for (let i = 1; i < rows.length; i++) {

      const ean = String(rows[i][1] || "").trim(); // Column B
      const qty = String(rows[i][2] || "").trim(); // Column C

      if (ean && qty) {
        output.push(`${ean}\t${qty}`);
      }
    }

    document.getElementById("input").value = output.join("\n");
  };

  reader.readAsArrayBuffer(file);
});

/* GENERATE */
function generate() {
  if (!ready) return;

  const lines = input.value.trim().split(/\n/);
  let rows = [];
  let totalQty = 0;

  for (const line of lines) {
    const cols = line.trim().split(/\s+/);
    if (cols.length < 2) continue;

    const ean = cols[0].trim();
    const qty = cols[1].trim();
    const category = (cols[2] && cols[2].trim()) ? cols[2].trim() : "Uncategorized";
    totalQty += parseInt(qty, 10) || 0;

    const last4 = ean.slice(-4);
    let allLocations = [];

    for (const key in index) {
      if (key.endsWith(last4)) {
        allLocations = allLocations.concat(index[key]);
      }
    }

    const loc = allLocations.length
      ? [...new Set(allLocations)].sort((a,b)=>a.localeCompare(b)).join(", ")
      : "* NOT FOUND *";

    const productName = nameIndex[ean] || "—";

    rows.push({ ean, qty, loc, productName, category });
  }

  const groupByCategory = document.getElementById("groupByCategory").checked;

  if (groupByCategory) {
    rows.sort((a, b) => {
      // ✅ Categories always on top, "Uncategorized" last
      if (a.category === "Uncategorized" && b.category !== "Uncategorized") return 1;
      if (b.category === "Uncategorized" && a.category !== "Uncategorized") return -1;

      const catCompare = a.category.localeCompare(b.category);
      if (catCompare !== 0) return catCompare;

      // ✅ Within category, sort by location descending
      return b.loc.localeCompare(a.loc);
    });
  } else {
    // ✅ Sort by location descending only
    rows.sort((a, b) => b.loc.localeCompare(a.loc));
  }

  let html = `
  <table>
    <tr>
      <th>EAN</th>
      <th>Qty</th>
      <th>Location</th>
      <th>
        <div style="display:flex; justify-content:space-between;">
          <span>Product Name</span>
          <span>Total ${totalQty} items</span>
        </div>
      </th>
    </tr>
  `;

  for (const r of rows) {
    html += `
      <tr>
        <td>${r.ean}</td>
        <td>${r.qty}</td>
        <td class="loc">${r.loc}</td>
        <td class="name">${r.productName}</td>
      </tr>
    `;
  }

  html += "</table>";

  document.getElementById("result").innerHTML = html;
  printBtn.style.display = "block";
}


</script>

</body>
</html>
