<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAN Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h2 {
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 140px;
            margin-top: 5px;
            padding: 8px;
            font-family: monospace;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .controls {
            margin-top: 15px;
        }
        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .output-section {
            margin-top: 20px;
        }
        .success-msg {
            color: #28a745;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <h2>EAN Counter</h2>
    <p>Paste EAN list below to count occurrences.</p>

    <label for="inputData">Paste EAN list (One item per line):</label>
    <textarea id="inputData" placeholder="Paste your values here..."></textarea>

    <div class="controls">
        <button id="convertBtn">Count</button>
    </div>

    <div class="output-section">
        <label for="outputData">TSV Output:</label>
        <textarea id="outputData" readonly></textarea>
        <div style="margin-top: 10px;">
            <button id="copyBtn">Copy</button>
            <span id="copyStatus" class="success-msg"></span>
        </div>
    </div>

    <script>
        function countAndTabulate() {
            const input = document.getElementById('inputData').value;
            const lines = input.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            
            // Count frequencies
            const counts = {};
            lines.forEach(line => {
                counts[line] = (counts[line] || 0) + 1;
            });
            
            // Format rows as TSV (Value \t Count)
            const rows = [];
            for (const [val, count] of Object.entries(counts)) {
                rows.push(`${val}\t${count}`);
            }
            
            document.getElementById('outputData').value = rows.join('\n');
        }

        document.getElementById('convertBtn').addEventListener('click', countAndTabulate);

        document.getElementById('copyBtn').addEventListener('click', () => {
            const outputBox = document.getElementById('outputData');
            outputBox.select();
            navigator.clipboard.writeText(outputBox.value).then(() => {
                const status = document.getElementById('copyStatus');
                status.textContent = 'Copied successfully!';
                setTimeout(() => { status.textContent = ''; }, 2000);
            });
        });
    </script>

</body>
</html>
