  </div></div><script>

function generate() {

if (!ready) {
result.innerText = "Still loading data...";
return;
}

const rows =
document.getElementById("input")
.value
.trim()
.split(/\r?\n/);

const output = [];

for (const row of rows) {

```
if (!row.trim()) continue;

const cols = row.split(/\t+/);

if (cols.length < 2) continue;

const ean = cols[0].trim();
const qty = cols[1].trim();

const code = ean.slice(-4);

const locations = index[code];

output.push(
  `${locations ? locations.join(", ") : "NOT FOUND"}\t${qty}\t${ean}`
);
```

}

output.sort((a,b)=>a.localeCompare(b));

document.getElementById("result").innerText =
output.join("\n");
}

function copyResult() {

navigator.clipboard.writeText(
document.getElementById("result").innerText
);

alert("Copied");
}

</script>
