<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EAN Lookup</title>

  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: Arial;
      background: #f5f6f8;
      margin: 0;
      padding: 30px;
      display: flex;
      justify-content: center;
      transition: background 0.3s, color 0.3s;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      position: relative;
      transition: background 0.3s, box-shadow 0.3s;
    }

    /* Minimalist mode toggle button */
    .mode-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 0;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      color: inherit;
    }

    .mode-toggle:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* INPUT WRAP FOR X BUTTON */
    .input-wrap {
      position: relative;
      width: 100%;
    }

    .input-wrap input {
      width: 100%;
      padding: 14px 35px 14px 14px;
      font-size: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      background: #fff;
      color: #333;
    }

    .input-wrap input:focus {
      outline: none;
      border-color: #4a90e2;
    }

    .clear-x {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 38px;
      color: #666;
      cursor: pointer;
      user-select: none;
      background: #eee;
      border-radius: 8px;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clear-x:hover {
      background: #ccc;
      color: #222;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #3b7bd6;
    }

    #result {
      margin-top: 25px;
      font-size: 44px;
      font-weight: bold;
      white-space: pre-wrap;
      line-height: 1.6;
      text-align: center;
    }

    /* DARK MODE STYLES */
    body.dark-mode {
      background: #121212;
      color: #e0e0e0;
    }

    body.dark-mode .card {
      background: #1e1e1e;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      color: #e0e0e0;
    }

    body.dark-mode h2 {
      color: #ffffff;
    }

    body.dark-mode .input-wrap input {
      background: #2d2d2d;
      border-color: #444;
      color: #ffffff;
    }

    body.dark-mode .input-wrap input:focus {
      border-color: #3b7bd6;
    }

    body.dark-mode .clear-x {
      background: #333;
      color: #bbb;
    }

    body.dark-mode .clear-x:hover {
      background: #444;
      color: #fff;
    }

    body.dark-mode button {
      background: #3b7bd6;
    }

    body.dark-mode button:hover {
      background: #4a90e2;
    }

    /* Keep toggle transparent in dark mode */
    body.dark-mode .mode-toggle {
      background: transparent;
    }

    body.dark-mode .mode-toggle:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>

<!-- Default to dark-mode class on body -->
<body class="dark-mode">

<div class="card">
  <!-- Mode Toggle Button (Starts with Moon for default dark mode) -->
  <button class="mode-toggle" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode">
    <i class="fa-solid fa-moon"></i>
  </button>

  <h2>EAN Lookup</h2>

  <!-- INPUT WITH X BUTTON -->
  <div class="input-wrap">
    <input id="sku" placeholder="Enter EAN" inputmode="numeric" pattern="[0-9]*">
    <span class="clear-x" onclick="document.getElementById('sku').value=''">×</span>
  </div>

  <button onclick="lookup()">Search</button>

  <div id="result">Loading data...</div>

</div>

<script>

const csvUrl =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQa-6Tub9Q1Hgn5ecCBkB9HpvAaTy8I0u5L_F0xSMML6FRQVqmijau8XdnWLCHVn8dsXBhrxIxu0eR/pub?gid=0&single=true&output=csv";

let index = {};
let ready = false;

// Toggle Dark/Light Mode function
function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  const toggleBtn = document.querySelector('.mode-toggle');
  
  toggleBtn.innerHTML = isDark 
    ? '<i class="fa-solid fa-moon"></i>' 
    : '<i class="fa-solid fa-sun"></i>';
    
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

// CSV PARSER (UNCHANGED)
function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;

  for (let char of line) {
    if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }

  result.push(current);
  return result;
}

// Build index
fetch(csvUrl)
  .then(r => r.text())
  .then(text => {

    const lines = text.split(/\r?\n/);

    for (let i = 1; i < lines.length; i++) {

      const line = lines[i].trim();
      if (!line) continue;

      const cols = parseCSVLine(line);

      const sku = (cols[0] || '').trim();
      const loc = (cols[1] || '').trim();

      if (!sku || !loc) continue;

      if (!index[sku]) index[sku] = [];

      index[sku].push(
        ...loc.split(',').map(x => x.trim()).filter(Boolean)
      );
    }

    ready = true;
    document.getElementById('result').innerText = "Ready";
  })
  .catch(err => {
    document.getElementById('result').innerText =
      "CSV load failed";
    console.error(err);
  });

// lookup (UNCHANGED)
function lookup() {

  if (!ready) {
    document.getElementById('result').innerText =
      "Still loading data...";
    return;
  }

  const sku = document.getElementById('sku').value.trim();

  const results = index[sku];

  if (results && results.length) {
    document.getElementById('result').innerText =
      results.join("\n");
  } else {
    document.getElementById('result').innerText =
      "Item not found";
  }
}

// ENTER KEY & THEME INIT
document.addEventListener("DOMContentLoaded", () => {
  // Respect saved theme if user explicitly switched to light mode before
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') {
    document.body.classList.remove('dark-mode');
    const toggleBtn = document.querySelector('.mode-toggle');
    if (toggleBtn) {
      toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
    }
  }

  const input = document.getElementById("sku");

  input.focus();

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      lookup();
    }
  });
});

</script>

</body>
</html>
