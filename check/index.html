<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Pick Quantities</title>

<style>
body {
  font-family: Arial;
  background: #f5f6f8;
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
}

.card {
  width: 100%;
  max-width: 1000px;
  background: white;
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
}

/* TWO TEXTAREAS */
.textarea-row {
  display: flex;
  gap: 12px;
}

.textarea-wrap {
  position: relative;
  flex: 1;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
}

textarea {
  width: 100%;
  height: 160px;
  font-family: monospace;
  font-size: 14px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-sizing: border-box;
  resize: vertical;
}

/* X BUTTON */
.clear-x {
  position: absolute;
  top: 34px;
  right: 10px;
  width: 34px;
  height: 34px;
  background: #d6d6d6;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
}

/* BUTTONS */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

#generateBtn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #4a90e2;
  color: white;
  cursor: pointer;
}

#printBtn {
  flex: 0.4;
  display: none;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #2ecc71;
  color: white;
  cursor: pointer;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  font-size: 13px;
  table-layout: auto;
}

th {
  background: #4a90e2;
  color: white;
  padding: 6px;
  text-align: left;
}

td {
  border: 1px solid #ddd;
  padding: 5px;
  vertical-align: top;
  white-space: nowrap;
}

/* LOCATION COLUMN */
td.loc {
  white-space: nowrap;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* NAME */
td.name {
  white-space: nowrap;
  width: 100%;
}

/* MOBILE */
@media (max-width: 700px) {
  .textarea-row {
    flex-direction: column;
  }
}

/* PRINT ONLY TABLE */
@media print {
  body * {
    visibility: hidden;
  }

  #result,
  #result * {
    visibility: visible;
  }

  #result {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }

  #result table tr:first-child {
    display: none;
  }

  textarea,
  .textarea-row,
  .btn-row {
    display: none !important;
  }
}
</style>
</head>

<body>

<div class="card">

<h2>Check Pick Quantities</h2>

<div class="textarea-row">

  <div class="textarea-wrap">
    <label>Required Items</label>
    <textarea id="input" placeholder="Paste full EAN and quantity from Excel"></textarea>
    <div class="clear-x" onclick="input.value=''">×</div>
  </div>

  <div class="textarea-wrap">
    <label>Serial Numbers</label>
    <textarea id="serials" placeholder="Paste serial numbers here"></textarea>
    <div class="clear-x" onclick="serials.value=''">×</div>
  </div>

</div>

<div class="btn-row">
  <button id="generateBtn" onclick="generate()">Generate</button>
  <button id="printBtn" onclick="window.print()">Print</button>
</div>

<div id="result"></div>

</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQQa-6Tub9Q1Hgn5ecCBkB9HpvAaTy8I0u5L_F0xSMML6FRQVqmijau8XdnWLCHVn8dsXBhrxIxu0eR/pub?gid=0&single=true&output=csv";

let index = {};
let nameIndex = {};
let ready = false;

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;

  for (let c of line) {
    if (c === '"') inQuotes = !inQuotes;
    else if (c === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += c;
    }
  }
  result.push(current);
  return result;
}

function cleanName(name) {
  return (name || "")
    .replace(/Uniform color/gi, "")
    .replace(/\s{2,}/g, " ")
    .trim();
}

fetch(csvUrl)
.then(r => r.text())
.then(text => {

  const lines = text.split(/\r?\n/);

  for (let i = 1; i < lines.length; i++) {

    const cols = parseCSVLine(lines[i]);
    if (!cols || cols.length < 6) continue;

    const sku = (cols[0] || '').trim();
    const loc = (cols[1] || '').trim();
    const ean = (cols[4] || '').trim();
    const name = cleanName(cols[5]);

    if (sku && loc) {
      if (!index[sku]) index[sku] = [];
      index[sku].push(loc);
    }

    if (ean && name) {
      nameIndex[ean] = name;
    }
  }

  ready = true;
  document.getElementById("result").innerHTML = "<b>Ready ✔</b>";
});

function sortLocation(a, b) {
  return a.localeCompare(b, undefined, {
    numeric: true,
    sensitivity: "base"
  });
}

function generate() {

  if (!ready) return;

  const lines = input.value.trim().split(/\n/);
  let rows = [];
  let totalQty = 0;

  for (const line of lines) {

    const cols = line.trim().split(/\s+/);
    if (cols.length < 2) continue;

    const ean = cols[0].trim();
    const qty = cols[1].trim();
    totalQty += parseInt(qty, 10) || 0;

    const last4 = ean.slice(-4);

    let allLocations = [];

    for (const key in index) {
      if (key.endsWith(last4)) {
        allLocations = allLocations.concat(index[key]);
      }
    }

    const loc = allLocations.length
      ? [...new Set(allLocations)].sort(sortLocation).join(", ")
      : "* NOT FOUND *";

    const productName = nameIndex[ean] || "—";

    rows.push({
      ean,
      qty,
      loc,
      productName
    });
  }

  rows.sort((a, b) => a.loc.localeCompare(b.loc));

  let html = `
  <table>
    <tr>
      <th>EAN</th>
      <th>Qty</th>
      <th>Location</th>
      <th>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Product Name</span>
          <span>Total ${totalQty} items</span>
        </div>
      </th>
    </tr>
  `;

  for (const r of rows) {
    html += `
      <tr>
        <td>${r.ean}</td>
        <td>${r.qty}</td>
        <td class="loc">${r.loc}</td>
        <td class="name">${r.productName}</td>
      </tr>
    `;
  }

  html += "</table>";

  document.getElementById("result").innerHTML = html;
  printBtn.style.display = "block";
}

</script>

</body>
</html>
