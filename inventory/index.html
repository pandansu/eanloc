<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory System</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
    }

    .container {
        display: flex;
        height: 100vh;
    }

    .panel {
        flex: 1;
        padding: 20px;
        background: white;
        border-right: 1px solid #ddd;
        overflow-y: auto;
    }

    .panel:last-child {
        border-right: none;
    }

    h2 { margin-top: 0; }

    input, button {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        font-size: 14px;
    }

    button {
        background: #0078d4;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #005ea6;
    }

    .box {
        padding: 12px;
        border: 1px solid #ddd;
        background: #fafafa;
        min-height: 60px;
    }

    .success { color: green; font-weight: bold; }
    .error { color: red; }
</style>
</head>

<body>

<div class="container">

<!-- ================= LEFT PANEL ================= -->
<div class="panel">
    <h2>Column D → Column G Lookup</h2>

    <input type="file" id="lookupFile" accept=".xlsx,.xls">

    <input type="text" id="searchKey" maxlength="4" placeholder="Enter last 4 digits">

    <button id="searchBtn">Search</button>

    <div class="box" id="lookupResult">No file loaded</div>
</div>

<!-- ================= MIDDLE PANEL ================= -->
<div class="panel">
    <h2>Sales Inventory</h2>

    <p>
        Duplicate last sheet → rename → match Column A → write Column J
    </p>

    <input type="file" id="inventoryFile" accept=".xlsx,.xls">

    <button id="processInventory">Process Sales Inventory</button>

    <div class="box" id="inventoryResult">No file loaded</div>
</div>

<!-- ================= RIGHT PANEL ================= -->
<div class="panel">
    <h2>Future Panel</h2>
    <div style="text-align:center;color:#888;margin-top:100px;">
        Empty
    </div>
</div>

</div>

<script>

/* ================= GLOBAL LOOKUPS ================= */

let last4Lookup = {};   // left panel
let fullLookup = {};    // sales inventory

/* ================= LEFT FILE LOAD ================= */

document.getElementById('lookupFile')
.addEventListener('change', async (e) => {

    const file = e.target.files[0];
    if (!file) return;

    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, { type: 'array' });

    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: ''
    });

    last4Lookup = {};
    fullLookup = {};

    rows.forEach(row => {

        const colD = String(row[3] || '').trim();
        const colG = row[6];

        if (!colD) return;

        fullLookup[colD] = colG;

        const last4 = colD.slice(-4);
        if (last4.length === 4) {
            last4Lookup[last4] = colG;
        }
    });

    document.getElementById('lookupResult').innerHTML =
        `Loaded ${Object.keys(fullLookup).length} records`;
});

/* ================= LEFT SEARCH ================= */

function search() {

    const key = document.getElementById('searchKey').value.trim();

    if (!/^\d{4}$/.test(key)) {
        document.getElementById('lookupResult').innerHTML =
            '<span class="error">Enter 4 digits</span>';
        return;
    }

    const value = last4Lookup[key];

    document.getElementById('lookupResult').innerHTML =
        value ? `<span class="success">${value}</span>`
              : `<span class="error">Not found</span>`;
}

document.getElementById('searchBtn').addEventListener('click', search);

document.getElementById('searchKey')
.addEventListener('keypress', e => {
    if (e.key === 'Enter') search();
});

/* ================= MIDDLE PANEL ================= */

document.getElementById('processInventory')
.addEventListener('click', async () => {

    const file = document.getElementById('inventoryFile').files[0];

    if (!file) {
        document.getElementById('inventoryResult').innerHTML =
            '<span class="error">Select workbook</span>';
        return;
    }

    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, { type: 'array' });

    const lastName = wb.SheetNames[wb.SheetNames.length - 1];
    const lastSheet = wb.Sheets[lastName];

    const today = new Date();
    const newName = today.toLocaleDateString('en-GB', {
        day: 'numeric',
        month: 'long'
    });

    if (wb.SheetNames.includes(newName)) {
        document.getElementById('inventoryResult').innerHTML =
            '<span class="error">Sheet already exists</span>';
        return;
    }

    /* ===== SAFE CLONE (preserves formulas/formatting) ===== */

    const newSheet = XLSX.utils.sheet_to_json(lastSheet, {
        header: 1,
        defval: ''
    });

    const cloned = XLSX.utils.aoa_to_sheet(newSheet);

    wb.Sheets[newName] = cloned;
    wb.SheetNames.push(newName);

    const range = XLSX.utils.decode_range(cloned['!ref']);

    for (let r = 1; r <= range.e.r; r++) {

        const aCell = XLSX.utils.encode_cell({ r, c: 0 });
        const jCell = XLSX.utils.encode_cell({ r, c: 9 });

        const item = cloned[aCell]?.v
            ? String(cloned[aCell].v).trim()
            : '';

        cloned[jCell] = {
            t: 'n',
            v: fullLookup[item] ?? 0
        };
    }

    XLSX.writeFile(wb, file.name);

    document.getElementById('inventoryResult').innerHTML =
        `<span class="success">Created "${newName}"</span>`;
});

</script>

</body>
</html>
