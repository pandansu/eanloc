<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Last 4 Digits Lookup</title>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input[type="file"],
        input[type="text"],
        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            cursor: pointer;
            background: #0078d4;
            color: white;
            border: none;
        }

        button:hover {
            background: #005ea6;
        }

        #status {
            margin-top: 10px;
            color: #666;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            background: #f8f8f8;
            min-height: 50px;
        }

        .match {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        .not-found {
            color: red;
        }
    </style>
</head>
<body>

    <h2>Excel Lookup (Column D → Column G)</h2>

    <p>
        Upload an Excel file. Enter the last 4 digits of a value in Column D
        to retrieve the corresponding value from Column G.
    </p>

    <input type="file" id="fileInput" accept=".xlsx,.xls">

    <input
        type="text"
        id="searchKey"
        maxlength="4"
        placeholder="Enter last 4 digits (e.g. 5900)"
    >

    <button id="searchBtn">Search</button>

    <div id="status">No file loaded.</div>

    <div id="result">
        Upload an Excel file to begin.
    </div>

    <script>
        let lookupData = {};

        const fileInput = document.getElementById("fileInput");
        const searchInput = document.getElementById("searchKey");
        const searchBtn = document.getElementById("searchBtn");
        const resultDiv = document.getElementById("result");
        const statusDiv = document.getElementById("status");

        fileInput.addEventListener("change", function (e) {
            const file = e.target.files[0];

            if (!file) return;

            const reader = new FileReader();

            reader.onload = function (event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: "array" });

                const firstSheet =
                    workbook.Sheets[workbook.SheetNames[0]];

                const rows = XLSX.utils.sheet_to_json(firstSheet, {
                    header: 1,
                    defval: ""
                });

                lookupData = {};

                let count = 0;

                rows.forEach(row => {
                    const colD = String(row[3] || "").trim(); // Column D
                    const colG = String(row[6] || "").trim(); // Column G

                    if (!colD || !colG) return;

                    const last4 = colD.slice(-4);

                    if (last4.length === 4) {
                        lookupData[last4] = colG;
                        count++;
                    }
                });

                statusDiv.textContent =
                    `Loaded ${count} records from Excel.`;

                resultDiv.innerHTML =
                    "File loaded successfully. Enter a 4-digit code.";
            };

            reader.readAsArrayBuffer(file);
        });

        function performSearch() {
            const key = searchInput.value.trim();

            if (!/^\d{4}$/.test(key)) {
                resultDiv.innerHTML =
                    '<span class="not-found">Please enter exactly 4 digits.</span>';
                return;
            }

            const value = lookupData[key];

            if (value !== undefined) {
                resultDiv.innerHTML =
                    `<span class="match">${value}</span>`;
            } else {
                resultDiv.innerHTML =
                    '<span class="not-found">No matching record found.</span>';
            }
        }

        searchBtn.addEventListener("click", performSearch);

        searchInput.addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                performSearch();
            }
        });
    </script>

</body>
</html>
