<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Inventory Worksheet Duplicator</title>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 20px;
            background: #0078d4;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #005ea6;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border: 1px solid #ddd;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

    <h2>Sales Inventory Worksheet Duplicator</h2>

    <p>
        Upload your Sales Inventory workbook.<br>
        The last worksheet will be duplicated and renamed with today's date
        (e.g. <strong>1 June</strong>).
    </p>

    <input type="file" id="excelFile" accept=".xlsx,.xls">

    <button id="processBtn">Process Workbook</button>

    <div id="status">
        Select an Excel workbook to begin.
    </div>

    <script>
        const fileInput = document.getElementById('excelFile');
        const processBtn = document.getElementById('processBtn');
        const statusDiv = document.getElementById('status');

        processBtn.addEventListener('click', async () => {

            const file = fileInput.files[0];

            if (!file) {
                statusDiv.innerHTML =
                    '<span class="error">Please select an Excel file.</span>';
                return;
            }

            try {

                const data = await file.arrayBuffer();

                const workbook = XLSX.read(data, {
                    type: 'array'
                });

                if (workbook.SheetNames.length === 0) {
                    throw new Error('No worksheets found.');
                }

                // Get last worksheet
                const lastSheetName =
                    workbook.SheetNames[workbook.SheetNames.length - 1];

                const lastSheet =
                    workbook.Sheets[lastSheetName];

                // Today's date format: "1 June"
                const today = new Date();

                const newSheetName = today.toLocaleDateString(
                    'en-GB',
                    {
                        day: 'numeric',
                        month: 'long'
                    }
                );

                // Prevent duplicate sheet names
                if (workbook.SheetNames.includes(newSheetName)) {
                    statusDiv.innerHTML =
                        `<span class="error">
                            Worksheet "${newSheetName}" already exists.
                        </span>`;
                    return;
                }

                // Deep copy worksheet
                workbook.Sheets[newSheetName] =
                    JSON.parse(JSON.stringify(lastSheet));

                workbook.SheetNames.push(newSheetName);

                // Download updated workbook
                XLSX.writeFile(workbook, file.name);

                statusDiv.innerHTML =
                    `<span class="success">
                        Successfully created worksheet "${newSheetName}"
                        from "${lastSheetName}".
                    </span>`;

            } catch (err) {

                console.error(err);

                statusDiv.innerHTML =
                    `<span class="error">
                        Error processing workbook: ${err.message}
                    </span>`;
            }
        });
    </script>

</body>
</html>
