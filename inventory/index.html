<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory System</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
    }

    .container {
        display: flex;
        height: 100vh;
    }

    .panel {
        flex: 1;
        padding: 20px;
        background: white;
        border-right: 1px solid #ddd;
        overflow-y: auto;
    }

    .panel:last-child {
        border-right: none;
    }

    h2 { margin-top: 0; }

    input, button {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        font-size: 14px;
    }

    button {
        background: #0078d4;
        color: white;
        border: none;
        cursor: pointer;
    }

    .box {
        padding: 12px;
        background: #fafafa;
        border: 1px solid #ddd;
        min-height: 60px;
    }

    .success { color: green; font-weight: bold; }
    .error { color: red; }
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="panel">
<h3>Lookup</h3>

<input type="file" id="lookupFile">
<input type="text" id="searchKey" maxlength="4" placeholder="Last 4 digits">
<button id="searchBtn">Search</button>

<div class="box" id="lookupResult"></div>
</div>

<!-- MIDDLE -->
<div class="panel">
<h3>Sales Inventory</h3>

<input type="file" id="inventoryFile">
<button id="runBtn">Process + Rename Sheet</button>

<div class="box" id="inventoryResult"></div>
</div>

<!-- RIGHT -->
<div class="panel">
<h3>Future</h3>
<div class="box">Empty</div>
</div>

</div>

<script>

/* ================= LOOKUP ================= */

let map = {};

document.getElementById('lookupFile').addEventListener('change', async e => {

const wb = XLSX.read(await e.target.files[0].arrayBuffer(), {type:'array'});
const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});

map = {};

rows.forEach(r => {
    const d = String(r[3] || '').trim();
    const g = r[6];
    if(d) map[d] = g;
});

document.getElementById('lookupResult').innerText =
    "Loaded " + Object.keys(map).length;
});

document.getElementById('searchBtn').onclick = () => {
const k = document.getElementById('searchKey').value.trim();
document.getElementById('lookupResult').innerText =
    map[k] ?? "Not found";
};

/* ================= MIDDLE ================= */

document.getElementById('runBtn').addEventListener('click', async () => {

const file = document.getElementById('inventoryFile').files[0];
if(!file){
    alert("Upload file");
    return;
}

const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});

const oldName = wb.SheetNames[wb.SheetNames.length - 1];
const sheet = wb.Sheets[oldName];

/* ================= SAFE RENAME ================= */

const today = new Date();
const newName = today.toLocaleDateString('en-GB', {
    day: 'numeric',
    month: 'long'
}).toUpperCase(); // "1 JUNE"

wb.SheetNames[wb.SheetNames.length - 1] = newName;
wb.Sheets[newName] = sheet;
delete wb.Sheets[oldName];

/* ================= UPDATE COLUMN J ================= */

const range = XLSX.utils.decode_range(sheet['!ref']);

for(let r=1;r<=range.e.r;r++){

    const aCell = XLSX.utils.encode_cell({r,c:0});
    const jCell = XLSX.utils.encode_cell({r,c:9});

    const key = sheet[aCell]?.v
        ? String(sheet[aCell].v).trim()
        : '';

    if(!key) break;

    const value = map[key] ?? 0;

    if(!sheet[jCell]) {
        sheet[jCell] = {t:'n', v:value};
    } else {
        sheet[jCell].v = value;
        sheet[jCell].t = 'n';
    }
}

XLSX.writeFile(wb, file.name);

document.getElementById('inventoryResult').innerText =
    "Processed + renamed to " + newName;

});

</script>

</body>
</html>
