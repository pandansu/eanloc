<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inventory System</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

<style>
body { margin:0; font-family:Arial; }
.container { display:flex; height:100vh; }
.panel { flex:1; padding:20px; border-right:1px solid #ddd; overflow:auto; }
.panel:last-child { border:none; }
input,button { width:100%; padding:10px; margin:8px 0; }
button { background:#0078d4; color:#fff; border:none; cursor:pointer; }
.box { padding:10px; background:#f5f5f5; min-height:50px; }
.success { color:green; font-weight:bold; }
.error { color:red; }
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="panel">
<h3>Lookup (D → G)</h3>

<input type="file" id="file1">
<input type="text" id="key" placeholder="Last 4 digits">
<button onclick="search()">Search</button>

<div class="box" id="out1"></div>
</div>

<!-- MIDDLE -->
<div class="panel">
<h3>Sales Inventory</h3>

<input type="file" id="file2">
<button onclick="process()">Update Column J</button>

<div class="box" id="out2"></div>
</div>

<!-- RIGHT -->
<div class="panel">
<h3>Future</h3>
<div class="box">Empty</div>
</div>

</div>

<script>

/* ================= LOOKUP ================= */

let map = {};

document.getElementById('file1').addEventListener('change', async e => {

const wb = XLSX.read(await e.target.files[0].arrayBuffer(), {type:'array'});
const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});

map = {};

rows.forEach(r => {
    const d = String(r[3]||'');
    const g = r[6];
    map[d.slice(-4)] = g;
});

document.getElementById('out1').innerText =
    "Loaded " + Object.keys(map).length;
});

function search(){
const k = document.getElementById('key').value;
document.getElementById('out1').innerText = map[k] || "Not found";
}

/* ================= SAFELY UPDATE COLUMN J ================= */

function process(){

const file = document.getElementById('file2').files[0];
if(!file){ alert("Upload file"); return; }

const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});

const sheetName = wb.SheetNames[wb.SheetNames.length - 1];
const sheet = wb.Sheets[sheetName];

const range = XLSX.utils.decode_range(sheet['!ref']);

for(let r=1;r<=range.e.r;r++){

    const aAddr = XLSX.utils.encode_cell({r,c:0}); // Column A
    const jAddr = XLSX.utils.encode_cell({r,c:9}); // Column J

    const key = sheet[aAddr]?.v
        ? String(sheet[aAddr].v).trim()
        : '';

    if(!key) break; // stop at blank row (protect totals)

    const value = map[key] ?? 0;

    /* ==========================================
       KEY FIX: preserve existing cell formatting
    ========================================== */

    if(!sheet[jAddr]) {
        sheet[jAddr] = { t:'n', v:value };
    } else {
        sheet[jAddr].v = value; // ONLY change value
        sheet[jAddr].t = 'n';   // ensure numeric type
    }
}

XLSX.writeFile(wb, file.name);

document.getElementById('out2').innerText =
    "Column J updated (format preserved)";
}

</script>

</body>
</html>
