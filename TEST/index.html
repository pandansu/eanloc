<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Pick Quantities</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #f5f6f8;
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
}

.card {
  width: 100%;
  max-width: 1000px;
  background: white;
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
}

.textarea-row {
  display: flex;
  gap: 12px;
}

.textarea-wrap {
  position: relative;
  flex: 1;
}

.serial-container {
  position: relative;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
}

textarea {
  width: 100%;
  height: 160px;
  font-family: monospace;
  font-size: 14px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-sizing: border-box;
  resize: vertical;
}

#serials,
#input {
  padding-right: 90px;
}

.clear-x {
  position: absolute;
  top: 34px;
  right: 10px;
  width: 34px;
  height: 34px;
  background: #d6d6d6;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: pointer;
  z-index: 3;
}

.upload-inside-btn {
  position: absolute;
  top: 10px;
  right: 50px;
  width: 34px;
  height: 34px;
  padding: 0;
  border: none;
  border-radius: 6px;
  background: #4a90e2;
  color: white;
  font-size: 16px;
  cursor: pointer;
  z-index: 2;
}

.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

button {
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#generateBtn {
  flex: 1;
  background: #4a90e2;
  color: white;
}

#checkBtn {
  flex: 1;
  background: #ff9800;
  color: white;
}

.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  gap: 10px;
}

.upload-box {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.hide-box {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  white-space: nowrap;
  margin-left: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  font-size: 13px;
  table-layout: fixed;
}

th, td {
  border: 1px solid #ddd;
  padding: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

th {
  background: #4a90e2;
  color: white;
  text-align: left;
}

th:first-child,
td:first-child {
  width: 140px;
}

th:nth-child(2),
td:nth-child(2),
th:nth-child(3),
td:nth-child(3) {
  width: 120px;
  text-align: center;
}

th:nth-child(4),
td:nth-child(4) {
  width: auto;
  min-width: 200px;
}

.ok { background: #e8f7e8; }
.warn { background: #fff4e5; }
.bad { background: #ffe6e6; }

.errorItem {
  font-size: 13px;
  padding: 3px 0;
  border-bottom: 1px solid #eee;
}

@media (max-width: 700px) {
  .textarea-row {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="card">

<h2>Check Pick Quantities</h2>

<div class="textarea-row">

  <!-- REQUIRED ITEMS (NEW BUTTON ADDED) -->
  <div class="textarea-wrap">

    <label>Required Items</label>

    <div class="serial-container">

      <textarea id="input" Placeholder="6937224133099 3
6941565981059 2
6937224... "></textarea>

      <button
        type="button"
        class="upload-inside-btn"
        onclick="document.getElementById('requiredImportFile').click()">
        📄
      </button>

      <input
        type="file"
        id="requiredImportFile"
        accept=".xlsx,.xls"
        style="display:none">

    </div>

    <div class="clear-x" onclick="input.value=''">×</div>

  </div>

  <!-- SERIAL NUMBERS -->
  <div class="textarea-wrap">

    <label>Scanned Serial Numbers</label>

    <div class="serial-container">

      <textarea id="serials" Placeholder="ANGZNBF002018N
82JVNBJ00E023S
ANGZP4F00..."></textarea>

      <button
        type="button"
        class="upload-inside-btn"
        onclick="document.getElementById('serialImportFile').click()">
        📁
      </button>

      <input
        type="file"
        id="serialImportFile"
        accept=".xlsx,.xls"
        style="display:none">

    </div>

    <div class="clear-x" onclick="serials.value=''">×</div>

  </div>

</div>

<div class="top-row">

  <div class="upload-box">
    <label><b>Upload Excel (Inventory serial numbers)</b></label>
    <input type="file" id="excelFile" accept=".xlsx,.xls">
  </div>

  <label class="hide-box">
    <input type="checkbox" id="hideDone" onchange="renderTable()">
    Hide Done
  </label>

</div>

<div class="btn-row">
  <button id="generateBtn" onclick="generate()">Generate List</button>
  <button id="checkBtn" onclick="checkSerials()">Check Serials</button>
</div>

<div id="result"></div>
<div id="errors"></div>

</div>
<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQQa-6Tub9Q1Hgn5ecCBkB9HpvAaTy8I0u5L_F0xSMML6FRQVqmijau8XdnWLCHVn8dsXBhrxIxu0eR/pub?gid=0&single=true&output=csv";

let nameIndex = {};
let serialIndex = {};
let requiredRows = [];
let wrongItemRows = [];

const saved = localStorage.getItem("serialIndex");

if (saved) {
  try {
    serialIndex = JSON.parse(saved);
  } catch (e) {
    serialIndex = {};
  }
}

function cleanName(name) {
  return (name || "")
    .replace(/Uniform color/gi, "")
    .replace(/\s{2,}/g, " ")
    .trim();
}

/* CSV */


fetch(csvUrl)
.then(r => r.text())
.then(text => {

  const workbook = XLSX.read(text, { type: "string" });
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

  for (let i = 1; i < rows.length; i++) {

    const ean = String(rows[i][4] || "").trim();   // Col E
    const name = cleanName(String(rows[i][5] || "")); // Col F

    if (ean && name) {
      nameIndex[ean] = name;
    }
  }

  document.getElementById("generateBtn").disabled = false;
});

  

/* EXCEL PRODUCT FILE */

document.getElementById("excelFile")
  .addEventListener("change", loadExcel);

function loadExcel(e) {

  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(evt) {

    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: "array" });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

    serialIndex = {};

    for (let i = 1; i < rows.length; i++) {

      const serial = String(rows[i][0] || "").trim();
      const product = cleanName(
        String(rows[i][7] || "").trim()
      );

      if (serial) {
        serialIndex[serial] = product;
      }
    }

    localStorage.setItem(
      "serialIndex",
      JSON.stringify(serialIndex)
    );
  };

  reader.readAsArrayBuffer(file);
}

/* SERIAL IMPORT */

document
  .getElementById("serialImportFile")
  .addEventListener("change", importSerialsToTextarea);

function importSerialsToTextarea(e) {

  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(evt) {

    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: "array" });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

    const serialList = [];

    for (let i = 1; i < rows.length; i++) {

      const serial = String(rows[i][0] || "").trim();

      if (serial) {
        serialList.push(serial);
      }
    }

    document.getElementById("serials").value =
      serialList.join("\n");
  };

  reader.readAsArrayBuffer(file);
}
/* REQUIRED ITEMS IMPORT (NEW) */

document
  .getElementById("requiredImportFile")
  .addEventListener("change", importRequiredItems);

function importRequiredItems(e) {

  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(evt) {

    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: "array" });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

    const output = [];

    // B2 = EAN, C2 = Qty
    for (let i = 1; i < rows.length; i++) {

      const ean = String(rows[i][1] || "").trim();
      const qty = String(rows[i][2] || "").trim();

      if (ean && qty) {
        output.push(`${ean} ${qty}`);
      }
    }

    document.getElementById("input").value =
      output.join("\n");
  };

  reader.readAsArrayBuffer(file);
}

/* GENERATE */

function generate() {

  wrongItemRows = [];
  errors.innerHTML = "";
  
  const lines = input.value.trim().split("\n");

  requiredRows = [];

  for (const line of lines) {

    const cols = line.trim().split(/\s+/);

    if (cols.length < 2) continue;

    const ean = cols[0];
    const qty = parseInt(cols[1], 10) || 0;

    requiredRows.push({
      ean,
      qty,
      productName: cleanName(nameIndex[ean] || "—"),
      scanned: 0
    });
  }

  renderTable();
}

/* CHECK */

function checkSerials() {

  for (const r of requiredRows) {
    r.scanned = 0;
  }

  const list = serials.value.trim().split("\n");

  const used = new Set();

  let notFound = [];
  let wrongItems = [];

  wrongItemRows = [];

  for (const s of list) {

    const serial = s.trim();

    if (!serial || used.has(serial)) continue;

    used.add(serial);

    const product = serialIndex[serial];

    if (!product) {
      notFound.push(serial);
      continue;
    }

    let matched = false;

    for (const r of requiredRows) {
      if (r.productName === product) {
        r.scanned++;
        matched = true;
        break;
      }
    }
if (!matched) {

  const ean = Object.keys(nameIndex).find(
    key => nameIndex[key] === product
  ) || "";

  let existing = wrongItemRows.find(
    x => x.ean === ean
  );

  if (existing) {
    existing.count++;
    existing.serials.push(serial);
  } else {
    wrongItemRows.push({
      ean,
      product,
      count: 1,
      serials: [serial]
    });
  }

}
    
  }

  renderTable();
  renderErrors(notFound, wrongItems);
}

/* TABLE */

function renderTable() {

  const hideDone = document.getElementById("hideDone").checked;

let totalScanned = 0;
let totalRequired = 0;

for (const r of requiredRows) {
  totalScanned += r.scanned;
  totalRequired += r.qty;
}

for (const w of wrongItemRows) {
  totalScanned += w.count;
}
  
  let html = `
  <table>
    <tr>
      <th>EAN</th>
      <th>Scanned (${totalScanned})</th>
      <th>Required (${totalRequired})</th>
      <th>Product Name</th>
    </tr>
  `;

  for (const r of requiredRows) {

    let cls = "";

    if (r.scanned === r.qty) cls = "ok";
    else if (r.scanned > r.qty) cls = "bad";
    else cls = "warn";

    if (hideDone && cls === "ok") continue;

    html += `
      <tr class="${cls}">
        <td>${r.ean}</td>
        <td>${r.scanned}</td>
        <td>${r.qty}</td>
        <td>${r.productName}</td>
      </tr>
    `;
  }

for (const w of wrongItemRows) {

  html += `
    <tr class="bad">
      <td>${w.ean}</td>
      <td>${w.count}</td>
      <td>0</td>
      <td>${w.product}</td>
    </tr>
  `;
}
  
  html += "</table>";

  result.innerHTML = html;
}

/* ERRORS */

function renderErrors(notFound, wrongItems) {

  let html = "";

  if (notFound.length) {
    html += "<h3>❌ Not Found in Inventory Serial Numbers file</h3>";
    html += notFound.map(x => `<div class="errorItem">${x}</div>`).join("");
  }

  if (wrongItems.length) {
    html += "<h3>⚠️ Wrong Item List</h3>";
    html += wrongItems.map(x => `<div class="errorItem">${x}</div>`).join("");
  }

  errors.innerHTML = html;
}

</script>

</body>
</html>
