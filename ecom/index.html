<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Category Viewer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1400px;
    margin: auto;
}

h1 { margin-top: 0; }

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 15px;
    background: white;
    border-radius: 8px;
}

input, select, button {
    padding: 10px;
    font-size: 14px;
}

.summary {
    margin-bottom: 15px;
    color: #666;
}

.accordion {
    background: white;
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
}

.accordion-header {
    width: 100%;
    border: none;
    text-align: left;
    cursor: pointer;
    background: #1976d2;
    color: white;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
}

.accordion-content {
    display: none;
    padding: 15px;
}

.accordion-content.active {
    display: block;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.item {
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 6px;
    padding: 10px;
    word-break: break-word;
}

.item.highlight {
    background: #ffebee;
    border-color: #ef9a9a;
    color: #c62828;
    font-weight: bold;
}

@media (max-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 400px) {
    .grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="container">

<h1>Excel Category Viewer</h1>

<div class="controls">
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <select id="sheetSelect" disabled></select>
    <button id="loadBtn" disabled>Load</button>
</div>

<div id="output"></div>

</div>

<script>

let workbook;

const fileInput = document.getElementById('fileInput');
const sheetSelect = document.getElementById('sheetSelect');
const loadBtn = document.getElementById('loadBtn');
const output = document.getElementById('output');

fileInput.addEventListener('change', handleFile);
loadBtn.addEventListener('click', renderSheet);

function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(ev) {
        workbook = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });

        sheetSelect.innerHTML = '';
        workbook.SheetNames.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            sheetSelect.appendChild(opt);
        });

        sheetSelect.disabled = false;
        loadBtn.disabled = false;
    };

    reader.readAsArrayBuffer(file);
}

function isNumeric(value) {
    return /^\d+$/.test(value.trim());
}

function renderSheet() {

    const sheet = workbook.Sheets[sheetSelect.value];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

    const categories = {};

    for (let i = 1; i < rows.length; i++) {

        const category = String(rows[i][1] || '').trim(); // Col B
        const value = String(rows[i][5] || '').trim();    // Col F

        if (!category || !value) continue;

        if (!categories[category]) {
            categories[category] = { numeric: {}, serials: [] };
        }

        if (isNumeric(value)) {
            categories[category].numeric[value] =
                (categories[category].numeric[value] || 0) + 1;
        } else {
            categories[category].serials.push(value);
        }
    }

    output.innerHTML = '';

    Object.entries(categories).forEach(([cat, data]) => {

        const totalNumeric = Object.values(data.numeric)
            .reduce((a, b) => a + b, 0);

        const totalSerials = data.serials.length;

        const header = document.createElement('button');
        header.className = 'accordion-header';
        header.textContent = `${cat} (${totalNumeric + totalSerials})`;

        const content = document.createElement('div');
        content.className = 'accordion-content';

        const grid = document.createElement('div');
        grid.className = 'grid';

        // Numeric grouped first
        Object.entries(data.numeric)
            .sort((a, b) => b[1] - a[1])
            .forEach(([num, count]) => {
                const div = document.createElement('div');
                div.className = 'item highlight';
                div.textContent = `${num} (${count})`;
                grid.appendChild(div);
            });

        // Serial numbers
        data.serials.forEach(s => {
            const div = document.createElement('div');
            div.className = 'item';
            div.textContent = s;
            grid.appendChild(div);
        });

        header.addEventListener('click', () => {
            content.classList.toggle('active');
        });

        const acc = document.createElement('div');
        acc.className = 'accordion';

        content.appendChild(grid);
        acc.appendChild(header);
        acc.appendChild(content);

        output.appendChild(acc);
    });
}

</script>

</body>
</html>
