<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Category Viewer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1400px;
    margin: auto;
}

h1 {
    margin-top: 0;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 15px;
    background: white;
    border-radius: 8px;
}

input[type=file],
select,
button {
    padding: 10px;
    font-size: 14px;
}

.summary {
    margin-bottom: 15px;
    color: #666;
}

.accordion {
    background: white;
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
}

.accordion-header {
    width: 100%;
    border: none;
    text-align: left;
    cursor: pointer;
    background: #1976d2;
    color: white;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
}

.accordion-header:hover {
    background: #1565c0;
}

.accordion-content {
    display: none;
    padding: 15px;
}

.accordion-content.active {
    display: block;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.item {
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 6px;
    padding: 10px;
    word-break: break-word;
    min-height: 55px;
    display: flex;
    align-items: center;
}

.item.highlight {
    background: #ffebee;
    border-color: #ef9a9a;
    color: #c62828;
    font-weight: bold;
}

@media (max-width: 1000px) {
    .grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 700px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>Excel Category Viewer</h1>

    <div class="controls">
        <input type="file" id="fileInput" accept=".xlsx,.xls">

        <select id="sheetSelect" disabled>
            <option>Select Worksheet</option>
        </select>

        <button id="loadSheetBtn" disabled>
            Load Worksheet
        </button>
    </div>

    <div id="summary" class="summary"></div>
    <div id="output"></div>

</div>

<script>

let workbook = null;

const fileInput = document.getElementById('fileInput');
const sheetSelect = document.getElementById('sheetSelect');
const loadSheetBtn = document.getElementById('loadSheetBtn');
const output = document.getElementById('output');
const summary = document.getElementById('summary');

fileInput.addEventListener('change', loadWorkbook);
loadSheetBtn.addEventListener('click', loadWorksheet);

function loadWorkbook(event) {

    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        const data = new Uint8Array(e.target.result);

        workbook = XLSX.read(data, {
            type: 'array'
        });

        sheetSelect.innerHTML = '';

        workbook.SheetNames.forEach(sheetName => {

            const option = document.createElement('option');
            option.value = sheetName;
            option.textContent = sheetName;

            sheetSelect.appendChild(option);
        });

        sheetSelect.disabled = false;
        loadSheetBtn.disabled = false;
    };

    reader.readAsArrayBuffer(file);
}

function loadWorksheet() {

    if (!workbook) return;

    const sheetName = sheetSelect.value;
    const worksheet = workbook.Sheets[sheetName];

    const rows = XLSX.utils.sheet_to_json(worksheet, {
        header: 1,
        defval: ''
    });

    const categories = {};

    for (let i = 1; i < rows.length; i++) {

        const row = rows[i];

        const category = String(row[1] || '').trim(); // Column B
        const content = String(row[5] || '').trim();  // Column F

        if (!category || !content) continue;

        if (!categories[category]) {
            categories[category] = [];
        }

        categories[category].push(content);
    }

    renderCategories(categories);
}

function isNumericString(value) {
    return /^\d+$/.test(value.trim());
}

function renderCategories(categories) {

    output.innerHTML = '';

    const categoryNames = Object.keys(categories);

    summary.textContent =
        `${categoryNames.length} categories found`;

    categoryNames.forEach(category => {

        const values = categories[category];

        const numericCounts = {};
        const otherValues = [];

        values.forEach(value => {

            if (isNumericString(value)) {

                numericCounts[value] =
                    (numericCounts[value] || 0) + 1;

            } else {

                otherValues.push(value);

            }

        });

        const numericSummary = Object.entries(numericCounts)
            .map(([number, count]) => ({
                number,
                count
            }))
            .sort((a, b) => b.count - a.count);

        const accordion = document.createElement('div');
        accordion.className = 'accordion';

        const header = document.createElement('button');
        header.className = 'accordion-header';
        header.textContent = `${category} (${values.length})`;

        const content = document.createElement('div');
        content.className = 'accordion-content';

        const grid = document.createElement('div');
        grid.className = 'grid';

        numericSummary.forEach(item => {

            const div = document.createElement('div');

            div.className = 'item highlight';
            div.textContent = `${item.number} (${item.count})`;

            grid.appendChild(div);
        });

        otherValues.forEach(value => {

            const div = document.createElement('div');

            div.className = 'item';
            div.textContent = value;

            grid.appendChild(div);
        });

        content.appendChild(grid);

        header.addEventListener('click', () => {
            content.classList.toggle('active');
        });

        accordion.appendChild(header);
        accordion.appendChild(content);

        output.appendChild(accordion);
    });
}

</script>

</body>
</html>
